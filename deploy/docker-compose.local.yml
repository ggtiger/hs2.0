# =============================================================================
# Realso 本地开发 Docker Compose
# 包含: MySQL + Auth + WebAPI
# 
# 使用: cd deploy && docker compose -f docker-compose.local.yml up -d
# =============================================================================

services:
  # ---- MySQL ----
  mysql:
    image: mysql:8.0
    container_name: realso-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-d0001}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Auth ----
  auth:
    image: realso-auth:latest
    container_name: realso-auth
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      ConnectionStrings__D0001: "Server=mysql;Database=${MYSQL_DATABASE:-d0001};User=root;Password=${MYSQL_ROOT_PASSWORD:-rootpassword};Port=3306;Charset=utf8mb4"
    ports:
      - "${AUTH_PORT:-5000}:5000"
    volumes:
      - upload_data:/app/upload
      - log_data:/app/log
    depends_on:
      mysql:
        condition: service_healthy

  # ---- WebAPI ----
  webapi:
    image: realso-webapi:latest
    container_name: realso-webapi
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_PORT: "5001"
      Auth__Authority: "http://localhost:${AUTH_PORT:-5000}"
      Upload__ROOT: "/app/upload/"
      ConnectionStrings__D0001: "Server=mysql;Database=${MYSQL_DATABASE:-d0001};User=root;Password=${MYSQL_ROOT_PASSWORD:-rootpassword};Port=3306;Charset=utf8mb4"
    ports:
      - "${WEBAPI_PORT:-5001}:5001"
    volumes:
      - upload_data:/app/upload
      - log_data:/app/log
    depends_on:
      mysql:
        condition: service_healthy
      auth:
        condition: service_started

volumes:
  mysql_data:
  upload_data:
  log_data: