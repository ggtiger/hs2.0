# =============================================================================
# 外网代理服务器 nginx 配置
# 用途：内网服务器(172.21.0.9)不能访问外网，由外网服务器(101.42.97.106)反向代理
# 部署位置：外网服务器 /etc/nginx/conf.d/hs2.0-proxy.conf
#
# 对外端口映射：
#   6080 -> 内网 8080  管理后台（前端 + /api/ + /auth/ + WebSocket）
#   6088 -> 内网 8088  OnlyOffice 文档服务器
#   6001 -> 内网 5001  主 API 直连（旧客户端兼容）
#   6000 -> 内网 5000  认证服务直连（旧客户端兼容）
#
# 使用前请确认：
#   1. 外网服务器能访问内网 172.21.0.9（同 VPC 内网互通；不通请改成实际可达地址）
#   2. 安全组放行：6080、6088、6001、6000
#
# 验证：nginx -t && systemctl reload nginx
# =============================================================================

# 内网后端地址（按实际情况修改）
upstream hs2_backend_admin { server 172.21.0.9:8080; }      # 前端 + API 反代入口
upstream hs2_backend_onlyoffice { server 172.21.0.9:8088; } # OnlyOffice 文档服务器
upstream hs2_backend_webapi { server 172.21.0.9:5001; }     # 主 API 直连
upstream hs2_backend_auth { server 172.21.0.9:5000; }       # 认证服务直连

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# -----------------------------------------------------------------------------
# 1. 主入口 (6080)：管理后台 + /api/ + /auth/ + WebSocket
#    浏览器访问 http://101.42.97.106:6080/
# -----------------------------------------------------------------------------
server {
    listen 6080;
    server_name _;

    client_max_body_size 200m;              # 文件上传

    location / {
        proxy_pass http://hs2_backend_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;          # SignalR(/hub /assistantHub) 长连接
        proxy_send_timeout 86400s;
    }
}

# -----------------------------------------------------------------------------
# 2. OnlyOffice 文档服务器 (6088)
#    前端按「浏览器主机 + (前端端口+8)」动态加载 OnlyOffice，6080 对应 6088
#    浏览器访问 http://101.42.97.106:6088/
# -----------------------------------------------------------------------------
server {
    listen 6088;
    server_name _;

    client_max_body_size 100m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # 全部路径转发（/web-apps /sdkjs /fonts /healthcheck 等）
    location / {
        proxy_pass http://hs2_backend_onlyoffice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # 编辑器 WebSocket
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}

# -----------------------------------------------------------------------------
# 3. 主 API 直连 (6001)：旧客户端/移动端直接调 http://101.42.97.106:6001/api/...
# -----------------------------------------------------------------------------
server {
    listen 6001;
    server_name _;

    client_max_body_size 200m;

    location / {
        proxy_pass http://hs2_backend_webapi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
    }
}

# -----------------------------------------------------------------------------
# 4. 认证服务直连 (6000)：旧客户端兼容
# -----------------------------------------------------------------------------
server {
    listen 6000;
    server_name _;

    location / {
        proxy_pass http://hs2_backend_auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

