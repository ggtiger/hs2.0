# =============================================================================
# 兼容性覆盖：保留旧部署的宿主机端口映射（5000/5001）
# 外部客户端（移动端、OnlyOffice 回调等）仍可直连，同时 8080 走 nginx 反代
# compose 会自动加载此文件，无需额外参数
# =============================================================================

services:
  auth:
    ports:
      - "${AUTH_PORT:-5000}:5000"

  webapi:
    ports:
      - "${WEBAPI_PORT:-5001}:5001"
