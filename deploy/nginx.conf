server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # 前端路由 - history 模式支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理 - WebAPI
    # 注意: proxy_pass 不带 URI 部分，完整保留 /api/ 前缀
    #（后端路由为 api/[controller]，剥离前缀会导致 404）
    location /api/ {
        proxy_pass http://webapi:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth 反向代理
    location /auth/ {
        proxy_pass http://auth:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR WebSocket
    location /hub/ {
        proxy_pass http://webapi:5001/hub/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # AI 助手 / 聊天 WebSocket（前端 SignalR 连接）
    location ~ ^/(assistantHub|chatHub) {
        proxy_pass http://webapi:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 生产环境不对外提供 source map（.map 文件体积巨大，仅调试用）
    location ~* \.map$ {
        return 404;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}